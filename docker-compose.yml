version: '3.8'

services:
  stock-prediction-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock_trend_predictor
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./data_storage:/app/data_storage
      - ./saved_models:/app/saved_models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
