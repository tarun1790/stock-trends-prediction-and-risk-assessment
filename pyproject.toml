[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-trend-prediction"
version = "1.0.0"
description = "Predicting Stock Market Trends Using Machine Learning and Deep Learning Algorithms via Continuous and Binary Data"
authors = [
    { name = "tarun1790", email = "tarun.jampani45@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.23.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "yfinance>=0.2.30",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "plotly>=5.15.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",
]

[project.scripts]
stocktrend = "cli:main"
